name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The #[allow(..)] / #[expect(..)] ban. Its own step because a lint
      # silenced in the source is invisible to the clippy step above — without
      # this, a PR could add #![allow(clippy::unwrap_used)] and go green here
      # while failing ./tools/check.sh all locally.
      - name: No lint suppressions
        run: ./tools/check.sh no-allow
      # scripts/guardrails/run.sh fails CLOSED (exit 3) when ast-grep is absent,
      # and Rust is the stack that needs it: oxlint cannot parse Rust, so the
      # pattern rules have no other enforcer. jq is preinstalled on the GitHub
      # runners; ast-grep is not.
      - name: Install ast-grep
        run: cargo install ast-grep --locked
      - name: Structure
        run: bash scripts/guardrails/run.sh
      - name: Test
        run: cargo test --workspace
      - name: Protocol crate is sync + I/O-free (AC #22)
        run: |
          if cargo tree -p protocol | grep -qE 'reqwest|tokio|opendal|bollard|axum'; then
            echo "ERROR: protocol crate must not depend on I/O crates"
            exit 1
          fi
      - name: Run release-script tests
        # Explicit list, not a scripts/test/*.sh glob — the plist/systemd tests
        # there are macOS-only and would fail on ubuntu.
        run: |
          for t in assert_version changelog_extract package_release release_workflow release_finalize_workflow generate_homebrew_formula release_homebrew_workflow release_pr_workflow release_pr_script; do
            bash "scripts/test/${t}_test.sh"
          done