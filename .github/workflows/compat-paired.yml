name: compat-paired

# Epic #230 paired comparison: the SAME reusable probe
# (compat-reference-103-probe.yml) runs on toolu and on an unmodified official
# actions/runner v2.338.2, both registered by JIT on one temporary GitHub-hosted
# VM per platform under per-run labels. scripts/test/reference_compare.py
# <run_id> --out <report> compares the lanes; see docs/compatibility-evidence.md.
#
# Dispatch-only. `negative` is meant to fail, so a good run still concludes
# failure; the comparator decides. #237 adds a third, accelerated-mode toolu lane
# on the Linux-X64 VM whose runner runs in a container (`accelerated`, compared
# with nothing) and the hosted
# `surfaces` job, which reads annotations and deployment statuses back from the
# GitHub API (scripts/test/compat_surfaces_check.py). Two runners side by side
# on each hosted VM were first proven by #237's runs 42388230585 and 42389172867.
#
# #251 adds the `extended` probe jobs, a second runner per lane for concurrent
# jobs (`-pool` labels), toolu-only `lifecycle` jobs on a fresh-workspace and an
# ephemeral registration, and per-VM observations (`compat-251-<platform>-host`:
# provenance, disposable-value hits in each lane's own logs, lock renewals, poll
# failures, ephemeral state) plus a sanitized capture of the toolu `stack`
# message from the Linux-X64 VM. The comparator writes docs/compat-reference-230.json.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A live lane that did not run is UNVERIFIED, not green (#103). Host and probe
  # jobs need this one, so a missing secret leaves no self-hosted job queued.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAVE_LIVE_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN != '' }}
    steps:
      - name: Require live credentials
        if: ${{ env.HAVE_LIVE_TOKEN != 'true' }}
        run: |
          echo "::error::UNVERIFIED: TOOLU_RUNNER_LIVE_TOKEN is not set, so the paired lanes did not run; this is not coverage"
          exit 1
      # Present is not valid: the hosts need runner administration and job reads.
      # Only the HTTP status is printed.
      - name: Check the live credential
        env:
          GH_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN }}
        run: |
          for path in "actions/runners?per_page=1" "actions/runs/$GITHUB_RUN_ID/jobs?per_page=1"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$path")
            if [ "$status" != 200 ]; then
              echo "::error::credential check failed: HTTP $status for repos/$GITHUB_REPOSITORY/${path%%\?*}"
              exit 1
            fi
            echo "repos/$GITHUB_REPOSITORY/${path%%\?*}: HTTP $status"
          done

  host:
    name: host ${{ matrix.platform }}
    needs: guard
    runs-on: ${{ matrix.vm }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux-X64
            vm: ubuntu-latest
            archive: actions-runner-linux-x64-2.338.2.tar.gz
            sha256: baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40
            accelerated: true
          - platform: Linux-ARM64
            vm: ubuntu-24.04-arm
            archive: actions-runner-linux-arm64-2.338.2.tar.gz
            sha256: 670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945
          - platform: macOS-ARM64
            vm: macos-15
            archive: actions-runner-osx-arm64-2.338.2.tar.gz
            sha256: 25a065af409ffa317ab4d5a3b614dd15fc9c40f2172bc1b35a1b1258e919a388
    env:
      PLATFORM: ${{ matrix.platform }}
      ACCELERATED_LANE: ${{ matrix.accelerated }}
      LABEL_PREFIX: compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
      EXTENDED_LANES: true
      OFFICIAL_DIR: ${{ github.workspace }}/../official-251
      TOOLU_BIN: ${{ github.workspace }}/target/debug/toolu-runner
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Verify the official runner archive
        env:
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/actions/runner/releases/download/v2.338.2/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | shasum -a 256 --check --strict
          mkdir "$OFFICIAL_DIR"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$OFFICIAL_DIR"
      # `capture` writes each acquired message under the lane's _diag (0600);
      # only the sanitized `stack` message leaves the VM.
      - name: Build toolu
        run: cargo build -p toolu-runner --bin toolu-runner --features capture
      # A failure here leaves the probes queued; stop-queued-probes ends the run.
      - name: Serve both lanes until this platform's probes finish
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN }}
        run: bash scripts/test/compat_paired_host.sh run
      # The VM is gone by the time the comparator runs, so this is the only
      # place the containers can be seen. No artifact fails the comparison.
      - name: Record containers left on this VM
        if: runner.os == 'Linux'
        run: docker ps -a --format '{{.ID}} {{.Image}}' > containers.txt
      - name: Upload the container listing
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compat-paired-${{ matrix.platform }}-containers
          path: containers.txt
          if-no-files-found: error
      # Before unregistering: the ephemeral runner must already be gone.
      - name: Record the #251 host observations
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN }}
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
        run: bash scripts/test/compat_paired_host.sh report
      - name: Upload the #251 host observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compat-251-${{ matrix.platform }}-host
          path: ${{ runner.temp }}/host-251.json
          if-no-files-found: error
      - name: Sanitize the toolu stack capture
        if: matrix.platform == 'Linux-X64'
        run: bash scripts/test/compat_paired_host.sh capture "$RUNNER_TEMP/compat_251_stack_message.json"
      - name: Upload the sanitized stack capture
        if: matrix.platform == 'Linux-X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compat-251-stack-capture
          path: ${{ runner.temp }}/compat_251_stack_message.json
          if-no-files-found: error
      - name: Unregister both lanes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN }}
        run: bash scripts/test/compat_paired_host.sh unregister

  # Self-hosted jobs wait up to 24 hours for a runner, so a dead host would leave
  # its probes queued for that long.
  stop-queued-probes:
    needs: [guard, host]
    if: ${{ always() && needs.guard.result == 'success' && needs.host.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  probe:
    name: probe-${{ matrix.platform }}-${{ matrix.lane }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-X64, Linux-ARM64, macOS-ARM64]
        lane: [toolu, official]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/compat-reference-103-probe.yml
    with:
      runner_label: compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ matrix.lane }}
      lane: ${{ matrix.platform }}-${{ matrix.lane }}
      variant: probe
      who: world
      count: 3
      enabled: false
      expect_oidc: true
      run_docker: ${{ matrix.platform != 'macOS-ARM64' }}
      extended: true

  negative:
    name: negative-${{ matrix.platform }}-${{ matrix.lane }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-X64, Linux-ARM64, macOS-ARM64]
        lane: [toolu, official]
    permissions:
      contents: read
    uses: ./.github/workflows/compat-reference-103-probe.yml
    with:
      runner_label: compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ matrix.lane }}
      lane: ${{ matrix.platform }}-${{ matrix.lane }}
      variant: negative
      who: ''
      count: 3
      enabled: false
      expect_oidc: false
      run_docker: ${{ matrix.platform != 'macOS-ARM64' }}

  # #237: forwarder is the `toolu` lane above; this is the same probe on a toolu
  # registration with `[services] mode = "accelerated"` whose runner runs inside
  # an ubuntu container on the Linux-X64 host, so the artifact producer and its
  # consumer both execute in that container. No Docker jobs: the container has no
  # daemon, and GitHub job containers stay refused in accelerated mode.
  accelerated:
    name: probe-Linux-X64-toolu-accelerated
    needs: guard
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/compat-reference-103-probe.yml
    with:
      runner_label: compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-Linux-X64-toolu-accelerated
      lane: Linux-X64-toolu-accelerated
      variant: probe
      who: world
      count: 3
      enabled: false
      expect_oidc: true
      run_docker: false

  # #251 X-6, toolu-only (the official runner has no fresh mode, and every
  # official JIT runner is already single-use): consecutive jobs on a
  # `[workspace] mode = "fresh"` registration get distinct, empty workspaces, and
  # an ephemeral registration takes one job (the host checks it then exits,
  # deletes its state and is gone from GitHub). Never reference evidence.
  fresh-1:
    name: lifecycle-${{ matrix.platform }}-toolu-fresh-1
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-X64, Linux-ARM64, macOS-ARM64]
    runs-on: [self-hosted, "compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-toolu-fresh"]
    timeout-minutes: 10
    steps:
      - name: Start in an empty workspace and record it
        run: |
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          printf 'fresh-1\n' > "$GITHUB_WORKSPACE/compat-251-fresh"
          printf '%s\n' "$GITHUB_WORKSPACE" > "/tmp/compat-251-fresh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"

  fresh-2:
    name: lifecycle-${{ matrix.platform }}-toolu-fresh-2
    needs: fresh-1
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-X64, Linux-ARM64, macOS-ARM64]
    runs-on: [self-hosted, "compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-toolu-fresh"]
    timeout-minutes: 10
    steps:
      - name: Start in another empty workspace
        run: |
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          test "$(cat "/tmp/compat-251-fresh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}")" != "$GITHUB_WORKSPACE"

  ephemeral:
    name: lifecycle-${{ matrix.platform }}-toolu-ephemeral
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux-X64, Linux-ARM64, macOS-ARM64]
    runs-on: [self-hosted, "compat-paired-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-toolu-ephemeral"]
    timeout-minutes: 10
    steps:
      - name: Run once on the ephemeral registration
        run: echo "compat-251 ephemeral job on $RUNNER_NAME"

  # Observation runs on a hosted VM: a self-hosted job after the last consumer
  # could be left queued once the hosts stop their lanes.
  surfaces:
    needs: [guard, probe, negative, accelerated]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
    steps:
      - uses: actions/checkout@v7
      - name: Read annotations and deployments back from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test/compat_surfaces_check.py --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --out compat-237-surfaces.json --captures captures
      - name: Upload the surfaces report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compat-237-surfaces
          path: |
            compat-237-surfaces.json
            captures
          if-no-files-found: error
