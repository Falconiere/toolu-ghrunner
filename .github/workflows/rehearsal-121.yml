# TEMPORARY (#121): a no-publish rehearsal of release.yml's verify -> build ->
# chained image workflows, generated from release.yml's own job bodies, to
# measure runner/wall time and record checksums. A branch ref never logs in
# or pushes (the callees gate both on github.ref_type == 'tag'). Deleted
# before merge.
name: rehearsal-121
on:
  push:
    branches:
    - feat/121-release-run-the-gate-once
concurrency:
  group: rehearsal-121
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.94.1
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo nextest run --workspace
    - name: Doctests
      run: cargo test --workspace --doc
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
        - runner: macos-14
          os: darwin
          arch: arm64
        - runner: macos-15-intel
          os: darwin
          arch: amd64
        - runner: ubuntu-24.04
          os: linux
          arch: amd64
          container: rust:1.94.1-bookworm
        - runner: ubuntu-24.04-arm
          os: linux
          arch: arm64
          container: rust:1.94.1-bookworm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.94.1
    - name: Build release binary
      run: cargo build --release --locked --bin toolu-runner
    - name: Package tarball
      run: bash scripts/package-release.sh "${{ matrix.os }}" "${{ matrix.arch }}" target/release/toolu-runner dist
    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: toolu-runner-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/toolu-runner-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
    - name: Build daemon release binary
      if: matrix.os == 'linux'
      run: cargo build --release --locked --bin toolu-daemon
    - name: Package daemon tarball
      if: matrix.os == 'linux'
      run: bash scripts/package-daemon-release.sh "${{ matrix.os }}" "${{ matrix.arch }}" target/release/toolu-daemon dist
    - name: Upload daemon tarball
      if: matrix.os == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: toolu-daemon-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/toolu-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
  image:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      prebuilt_binaries: true
  macos-image:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-macos-image.yml
    with:
      prebuilt_binaries: true

