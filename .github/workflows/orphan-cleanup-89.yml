name: orphan-cleanup-89

# Issue #89 parity lane: scripts/test/orphan_cleanup_probe.sh leaves the same
# orphan kinds behind as crates/execution/tests/orphan_cleanup_test.rs. The
# runner's "Complete job" log (gh run view --log) must list
# "Terminate orphan process: pid (N) (...)" for every ORPHAN89|tagged pid and
# none for the ORPHAN89|opted-out pid. The push trigger exists because a
# dispatch-only workflow cannot run before it reaches the default branch (same
# as step-process-ci-72.yml); the toolu lane runs on a registered self-hosted
# toolu runner when dispatched with run_toolu.

on:
  workflow_dispatch:
    inputs:
      run_toolu:
        description: Run the toolu self-hosted lane when a matching runner is registered
        type: boolean
        default: false
  push:
    branches:
      - feat/89-clean-up-orphan-processes-after

permissions:
  contents: read

jobs:
  reference-host:
    name: reference-host-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave tagged orphans behind
        run: bash scripts/test/orphan_cleanup_probe.sh tagged
      - name: Opted-out process survives
        env:
          RUNNER_TRACKING_ID: ''
        run: bash scripts/test/orphan_cleanup_probe.sh opted-out

  toolu-host:
    if: github.event_name == 'workflow_dispatch' && inputs.run_toolu
    name: toolu-host
    runs-on: [self-hosted, toolu-runner-v1]
    steps:
      - uses: actions/checkout@v4
      - name: Leave tagged orphans behind
        run: bash scripts/test/orphan_cleanup_probe.sh tagged
      - name: Opted-out process survives
        env:
          RUNNER_TRACKING_ID: ''
        run: bash scripts/test/orphan_cleanup_probe.sh opted-out
