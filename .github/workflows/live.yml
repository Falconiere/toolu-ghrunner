name: live
# Dispatch-only (#120): the repo has no TOOLU_RUNNER_LIVE_TOKEN secret, so a
# cron could only produce a daily red check nobody can clear. Re-add a
# `schedule:` once the secret exists.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    # Only a boolean is job-level, so every step's `if:` can see it. (A
    # step-level `env:` is invisible to that step's own `if:`, which is how this
    # lane used to skip every day and still conclude success.) The token itself
    # stays scoped to the test step.
    env:
      HAVE_LIVE_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN != '' }}
    steps:
      # A live lane that did not run is UNVERIFIED, not green (#103). Fail
      # before the build so a missing secret costs seconds and reads plainly.
      - name: Require live credentials
        if: ${{ env.HAVE_LIVE_TOKEN != 'true' }}
        run: |
          echo "::error::UNVERIFIED: TOOLU_RUNNER_LIVE_TOKEN is not set, so the live lane did not run; this is not coverage"
          exit 1
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Build with --features live
        run: cargo build -p toolu-runner --features live --tests
      - name: Live tests (github.com)
        env:
          TOOLU_RUNNER_LIVE_TOKEN: ${{ secrets.TOOLU_RUNNER_LIVE_TOKEN }}
          TOOLU_RUNNER_LIVE_REPO: ${{ vars.TOOLU_RUNNER_LIVE_REPO || 'Falconiere/toolu-runner-test' }}
        run: cargo test -p toolu-runner --features live -- --ignored --test-threads=1
