name: release-image

# Tag-driven container publish: push vX.Y.Z -> release.yml gates + builds the
# release tarballs, then calls this workflow -> build linux/amd64 +
# linux/arm64 legs on native runners -> push both by digest -> merge into
# one multi-arch manifest at ghcr.io/<owner>/toolu-ghrunner -> print the
# digest-pinned ref. toolu.sh pins NAMESPACE_RUNNER_IMAGE /
# FLY_RUNNER_IMAGE by @sha256: digest (this container runs customer build
# code holding a live GitHub credential — never a mutable tag), so the
# manifest-list digest in the log and step summary IS the deliverable of
# this workflow. The arm64 leg exists for local runs on Apple-Silicon
# Macs; providers resolve amd64 from the same manifest digest.
#
# Each arch builds on its native runner (the same ubuntu-24.04 /
# ubuntu-24.04-arm pair release.yml builds on) — no QEMU emulation.
#
# Two VARIANTS ship from the one Dockerfile, each as its own manifest:
#
#   target: runner  suffix: ''         the lean default every provider pulls
#   target: docker  suffix: '-docker'  the same payload plus a Docker daemon
#
# The daemon lives behind its own tag rather than in the default image
# because toolu.sh's DEFAULT_RUNNER_IMAGE follows this repo's moving tag:
# fattening that image would slow the cold pull for every deployment, with
# no deploy at all, to serve the VPS hosts that opt in per host through
# `vps_hosts.image_ref`. The two targets share every expensive layer, so a
# leg's second build is mostly cache hits on the first.
#
# A tag reaches this workflow ONLY through release.yml (`workflow_call`,
# `needs: build`), never through its own `push: tags` trigger (#121). That
# gives one fmt/clippy/test gate per tag — release.yml's `verify` — and lets
# the legs reuse release.yml's binaries: called jobs run inside the caller's
# workflow run, so `build`'s tarball artifacts are downloadable here. With
# `prebuilt_binaries: true` each leg extracts `toolu-runner` from its arch's
# release tarball and builds the Dockerfile with RUNNER_BINARY=prebuilt, so
# the published image carries the tarball's binary byte for byte (the image
# build checks it against RUNNER_SHA256) instead of compiling it again.
#
# PRs touching the image inputs build without pushing (catches Dockerfile
# rot); workflow_dispatch does the same on demand. Neither has release
# artifacts, so both compile inside Docker (RUNNER_BINARY=build), and neither
# repeats the gate, because neither publishes. Every login / push / manifest
# condition requires BOTH a tag ref AND release.yml's call
# (`inputs.prebuilt_binaries`): a dispatch with a tag selected has a tag ref,
# but only release.yml has run the gate, so it must build and stop.
on:
  workflow_call:
    inputs:
      prebuilt_binaries:
        description: Build from the toolu-runner-linux-<arch> release tarballs this run's caller uploaded, instead of compiling in Docker.
        type: boolean
        default: false
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/docker-entrypoint.sh
      - .github/workflows/release-image.yml
  workflow_dispatch:

# One image per ref; never cancel a tag publish mid-flight.
concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege by default; only the pushing jobs get packages:write.
permissions:
  contents: read

env:
  # GHCR requires a lowercase namespace; the owner may not be. Bash
  # lowercasing happens where the value is consumed (env is verbatim).
  IMAGE_BASENAME: toolu-ghrunner

jobs:
  # One leg per arch PER VARIANT, built natively, pushed by digest only
  # (tags are applied by `manifest` after both of a variant's legs exist).
  #
  # `target` is a real dimension crossed with `arch`; the `include` entries
  # only attach the per-arch host and the per-variant tag suffix to the four
  # combinations. The suffix is carried here, not derived in `manifest`, so
  # exactly one place in this file decides which variant owns which tag.
  build:
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        target: [runner, docker]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - target: runner
            suffix: ''
          - target: docker
            suffix: '-docker'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push the per-arch leg to ghcr.io on tag
    steps:
      - uses: actions/checkout@v7
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
      # The prebuilt path (release.yml's call): this arch's release tarball,
      # uploaded by release.yml's `build` earlier in the same workflow run.
      - name: Download this arch's release tarball
        if: inputs.prebuilt_binaries
        uses: actions/download-artifact@v8
        with:
          name: toolu-runner-linux-${{ matrix.arch }}
          path: release-tarball
      # Extracted to the one path the Dockerfile's `binary-prebuilt` stage
      # copies (and .dockerignore admits). Its sha256 goes to the build as
      # RUNNER_SHA256, and the image build fails unless its copy matches.
      - name: Stage the release binary
        if: inputs.prebuilt_binaries
        id: binary
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          tarball="release-tarball/toolu-runner-linux-${ARCH}.tar.gz"
          mkdir -p dist
          tar -xzf "${tarball}" -O toolu-runner >"dist/toolu-runner-linux-${ARCH}"
          sha="$(sha256sum "dist/toolu-runner-linux-${ARCH}" | cut -d' ' -f1)"
          echo "sha256=${sha}" >>"$GITHUB_OUTPUT"
          {
            echo "## Release binary (linux/${ARCH}, ${TARGET} image)"
            echo "- tarball \`${tarball##*/}\` sha256 \`$(sha256sum "${tarball}" | cut -d' ' -f1)\`"
            echo "- \`toolu-runner\` inside it sha256 \`${sha}\` — the image build checks its copy against this"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.prebuilt_binaries && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push by digest on tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Always explicit, never the Dockerfile's default stage: the two
          # variants differ by nothing else, so an omitted target would
          # publish the same image under both tag lines.
          target: ${{ matrix.target }}
          # Where the binary comes from: the staged release binary on the
          # prebuilt path, an in-Docker compile otherwise (PR / dispatch). An
          # empty RUNNER_SHA256 (the compile path) skips only the sha check;
          # the image build still runs the binary on the runtime's libc.
          build-args: |
            RUNNER_BINARY=${{ inputs.prebuilt_binaries && 'prebuilt' || 'build' }}
            RUNNER_SHA256=${{ steps.binary.outputs.sha256 }}
          # On tag: push the leg untagged (digest-only); `manifest` stitches
          # and tags. On PR/dispatch: build-only.
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.prebuilt_binaries && github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Export leg digest
        if: inputs.prebuilt_binaries && github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload leg digest
        if: inputs.prebuilt_binaries && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          # Variant-scoped: `manifest` downloads one variant's legs by
          # pattern, and an arch-only name would stitch a runner leg and a
          # docker leg into a single manifest.
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  # Merge one variant's per-arch legs into one multi-arch manifest, tag it,
  # and print the manifest-list digest — the ref toolu.sh operators pin. One
  # job per variant: each publishes its own tag line off its own two legs.
  manifest:
    if: inputs.prebuilt_binaries && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      # Not fail-fast: the variants are independent tag lines, and cancelling
      # a half-finished publish of the other one buys nothing.
      fail-fast: false
      matrix:
        target: [runner, docker]
        include:
          - target: runner
            suffix: ''
          - target: docker
            suffix: '-docker'
    permissions:
      contents: read
      packages: write # push the merged manifest + tags
    steps:
      - name: Download leg digests
        uses: actions/download-artifact@v8
        with:
          # This variant's legs only — `digest-*` would pull the other
          # variant's in too and stitch both into one manifest.
          pattern: digest-${{ matrix.target }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create multi-arch manifest
        id: merge
        # `latest` and the `vN` compat line track stable tags only (a '-'
        # marks a prerelease, matching release.yml's rule) — though
        # consumers must pin by digest regardless.
        #
        # `vN` follows the semver compatibility boundary, which is the
        # MINOR while the major is 0 (0.6.x -> :v6, 0.7.x -> :v7) and the
        # MAJOR from 1.0 on (1.x -> :v1). The number therefore resets once
        # at 1.0.0 — :v1 is NEWER than :v7. That is deliberate; see
        # docs/container-image.md.
        #
        # Every tag this variant publishes carries VARIANT_SUFFIX, so the
        # lean image keeps :latest / :vN and the Docker-capable one gets
        # :latest-docker / :vN-docker. Replayed by
        # scripts/test/release_image_workflow_test.sh against a table of
        # refs and suffixes.
        env:
          VARIANT_SUFFIX: ${{ matrix.suffix }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}"
          # Fails closed rather than defaulting to empty: an unset suffix
          # would publish whatever this leg built onto :latest, which is the
          # tag toolu.sh's DEFAULT_RUNNER_IMAGE follows on every deployment.
          # `-v` asks the one question that matters and asks it by name —
          # "unset" and the runner variant's deliberately EMPTY value must
          # stay distinguishable, so an emptiness test would break the
          # default image.
          if [[ ! -v VARIANT_SUFFIX ]]; then
            echo "VARIANT_SUFFIX is unset — refusing to guess which variant these legs are" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "${image}:${version}${VARIANT_SUFFIX}")
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            tags+=(-t "${image}:latest${VARIANT_SUFFIX}")
            major="${version%%.*}"
            minor="${version#*.}"
            minor="${minor%%.*}"
            if [[ "${major}" == "0" ]]; then
              tags+=(-t "${image}:v${minor}${VARIANT_SUFFIX}")
            else
              tags+=(-t "${image}:v${major}${VARIANT_SUFFIX}")
            fi
          fi
          refs=()
          for d in /tmp/digests/*; do
            refs+=("${image}@sha256:$(basename "$d")")
          done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${image}:${version}${VARIANT_SUFFIX}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Print digest-pinned ref
        # The line toolu.sh operators copy into NAMESPACE_RUNNER_IMAGE /
        # FLY_RUNNER_IMAGE (the runner variant) or a VPS host's
        # `vps_hosts.image_ref` (the docker variant). The manifest-list
        # digest resolves per-arch (amd64 for the providers, arm64 for
        # Apple-Silicon local runs).
        env:
          VARIANT_SUFFIX: ${{ matrix.suffix }}
          VARIANT_TARGET: ${{ matrix.target }}
          IMAGE_REF: ${{ steps.merge.outputs.ref }}
        run: |
          echo "image ref (${VARIANT_TARGET}): ${IMAGE_REF}"
          if [[ -n "${VARIANT_SUFFIX}" ]]; then
            where="Set this digest as a VPS host's image_ref in toolu.sh (Docker-capable variant)."
          else
            where="Pin this digest in toolu.sh (NAMESPACE_RUNNER_IMAGE / FLY_RUNNER_IMAGE)."
          fi
          {
            echo "## Runner image (${VARIANT_TARGET})"
            echo '```'
            echo "${IMAGE_REF}"
            echo '```'
            echo "${where}"
          } >> "$GITHUB_STEP_SUMMARY"
