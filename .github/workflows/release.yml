name: release

# Tag-driven release: push vX.Y.Z -> verify tag==Cargo version -> gate ->
# build 4 native targets -> package tarballs (install.sh layout) + SHA256SUMS
# -> publish a GitHub Release with CHANGELOG-derived notes -> smoke-test the
# published assets and push the Homebrew formula. The workflow reads the repo,
# never writes to it. See docs/toolu/specs/2026-07-08-release-automation-design.md
#
# finalize + homebrew are chained here as reusable workflows rather than
# triggered by `on: release: [published]`: a release created by `gh release
# create` under the default GITHUB_TOKEN emits no `release` event, so
# event-triggered versions of them could never fire.
#
# The container images are chained here too (#121) — release-image.yml and
# release-macos-image.yml have no tag trigger of their own. So a tag runs the
# fmt/clippy/test gate exactly once (`verify` below), and the images pack the
# binaries `build` produced instead of compiling them again: a called
# workflow's jobs run inside THIS run, so they can download its artifacts.
# They follow `build`, not `publish`: they read the tarball artifacts, never
# the GitHub Release.
on:
  push:
    tags: ['v*']

# One release per tag; never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; only `publish` is granted write to cut the release.
permissions:
  contents: read

jobs:
  # scripts/deploy.sh publishes a release from a Mac, and `gh release create`
  # creating the tag fires this workflow too. Seeing that release already
  # exists, skip the whole run: `verify` and everything after it would rebuild,
  # re-push the deploy's images (moving their tags) and fail to publish. A
  # tag pushed by release-tag.sh has no release yet, so it runs as before.
  # ("Re-run all jobs" on a published tag therefore skips too; re-run failed
  # jobs instead.)
  published:
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release ${GITHUB_REF_NAME} already exists (scripts/deploy.sh) — skipping the CI release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: published
    if: needs.published.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches Cargo version
        run: bash scripts/assert-version.sh "${GITHUB_REF_NAME}"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            container: rust:1.94.1-bookworm
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            container: rust:1.94.1-bookworm
    runs-on: ${{ matrix.runner }}
    # Linux legs build inside the Dockerfile's `builder` image, never on the
    # ubuntu-24.04 host: a host build links glibc 2.39 symbols (Rust std's
    # pidfd_spawnp / pidfd_getpid), and that binary will not load on the
    # bookworm (glibc 2.36) runtime the release image ships it in. Same image,
    # same glibc floor — which also keeps the tarballs installable on Debian 12
    # hosts (the bookworm-built v0.10.0 binary references nothing past
    # GLIBC_2.34, so Ubuntu 22.04 runs it too). Darwin legs carry no
    # `container`, and an empty value runs the job on the host.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      # Native host build (no triple): each runner's host triple IS the
      # release target. The same recipe scripts/deploy.sh runs locally; on
      # linux it also builds + packages toolu-daemon (linux-only: it runs on
      # the toolu-operated compute box and talks to a local Docker socket).
      - name: Build and package
        run: bash scripts/build-release.sh "${{ matrix.os }}" "${{ matrix.arch }}" dist
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: toolu-runner-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/toolu-runner-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - name: Upload daemon tarball
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: toolu-daemon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/toolu-daemon-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/checkout@v7
      - name: Download all tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        run: bash scripts/changelog-extract.sh "${GITHUB_REF_NAME}" > release-notes.md
      # SHA256SUMS, the prerelease flag ('-' in the tag) and `gh release
      # create` — the same recipe scripts/deploy.sh publishes with.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist release-notes.md

  # Read the uploaded assets back off the release and verify them. Chained,
  # not event-triggered — see the header note. Assets are attached
  # synchronously by `gh release create`, so `needs: publish` is sufficient
  # ordering; there is no upload-visibility race to wait out.
  finalize:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-finalize.yml

  # Stable tags only; the callee's own `if:` enforces that. A called workflow
  # is granted github.token automatically but sees no other secret unless the
  # caller passes it. Pass the App credentials explicitly, NOT `secrets:
  # inherit` — inherit would forward every repo secret (RELEASE_PLZ_TOKEN,
  # OPENROUTER_API_KEY, …) to a workflow that needs exactly these two.
  homebrew:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-homebrew.yml
    secrets:
      HOMEBREW_APP_ID: ${{ secrets.HOMEBREW_APP_ID }}
      HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}

  # The GHCR images, built from `build`'s release tarballs (see the header).
  # `packages: write` is granted HERE because a called workflow can only
  # narrow the caller's token, never widen it; the callees push with
  # github.token alone, so no secret crosses. Each keeps its own concurrency
  # group (release-image-<tag> / release-macos-image-<tag>), distinct from
  # this workflow's, so a call can never cancel or wait on its caller.
  image:
    needs: build
    permissions:
      contents: read
      packages: write # push the per-arch legs + the multi-arch manifests
    uses: ./.github/workflows/release-image.yml
    with:
      prebuilt_binaries: true

  macos-image:
    needs: build
    permissions:
      contents: read
      packages: write # push the macOS carrier image
    uses: ./.github/workflows/release-macos-image.yml
    with:
      prebuilt_binaries: true
