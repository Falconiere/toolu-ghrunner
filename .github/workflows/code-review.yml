name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # upload the gitleaks/opengrep SARIF to the Code Scanning tab

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip the machine-generated release PR. Every byte of that diff is produced
    # by scripts/release-pr.sh — the git-cliff CHANGELOG prepend, the
    # [workspace.package] version line, and `cargo update` — so there is no
    # human-authored code in it to review, and the generator itself is covered
    # by scripts/test/release_pr_script_test.sh + release_pr_workflow_test.sh.
    # Reviewing it only ever produced the same two false positives, every
    # release (PR #49 hit both): the reviewer reads the generated
    # `## [X.Y.Z]` heading sitting under the permanently empty `## [Unreleased]`
    # slot as a hand-written entry placed inside it, and re-derives the version
    # bump against plain SemVer instead of cliff.toml's pre-1.0 [bump] policy.
    #
    # A job-level `if` (a skipped job counts as success) rather than an `on:`
    # branches-ignore filter, so the check still reports a conclusion if it is
    # ever made a required status check — a filtered-out workflow would instead
    # stay pending forever and block the release PR.
    #
    # The head-repo test is load-bearing, NOT redundant: `github.head_ref` is
    # only the source branch's name, and it reads the same for a fork PR as for
    # ours. On the branch name alone, anyone could fork this public repo, name a
    # branch `release-pr`, and have their PR's review silently skipped — and a
    # skipped job reports SUCCESS, a better disguise than the red ✗ a fork PR
    # gets today (the action step fails without the secrets, see RULES_REF
    # below). Only a same-repo `release-pr` is the generated one; a fork using
    # that name is reviewed like any other. Actions string comparison is
    # case-insensitive, so `Release-PR` matches too — harmless, since pushing
    # any such branch here already requires write access.
    if: ${{ github.head_ref != 'release-pr' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the merge-base resolves without deepening
      - uses: falconiere/toolu-ghactions/code-review@v7
        with:
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Repo-tuned checklist. Replaces the generic 8-dimension default with
          # the failure modes that actually bite this codebase: unmasked sinks,
          # swallowed errors, blocking I/O on the async runtime, durability
          # claims drifting from the code, and tests that mirror production
          # rather than drive it. Project conventions are still gathered and
          # injected on top of it.
          REVIEW_PROMPT_FILE: .github/code-review-prompt.md
          CODEBASE_OVERVIEW: |
            Standalone GitHub Actions JIT runner in Rust. A 10-crate workspace
            under crates/, layered and acyclic: protocol (sync crypto and wire
            types, no I/O) and shared (cross-cutting types, tracing, secret
            masking) at the bottom; config, expressions, cache, wire,
            observability in the middle; execution (the step engine) and
            listener (the GitHub JIT lifecycle) above them; toolu-runner is the
            bin-only CLI on top.

            It authenticates to GitHub with a single-use JIT config, long-polls
            a broker for jobs, and runs workflow steps on the host — so it
            handles live credentials, customer source, and job secrets on every
            run. The lint set is deliberately deny-heavy (no unwrap/expect/
            panic/indexing outside tests) and CLAUDE.md is the source of truth
            for the crate graph and each module's responsibilities.
          # Read convention files (CLAUDE.md etc.) from the PR merge ref
          # instead of the base ref, so a PR that legitimately changes a
          # convention is reviewed against its own updated text. Safety:
          # fork PRs do trigger `pull_request`, but the action step fails
          # for them (secrets are not exposed to fork runs), so no fork
          # diff is ever reviewed under merge-ref rules. Requires
          # toolu-ghactions >= 6.3.0.
          RULES_REF: merge
          # Surrender cap (toolu-ghactions >= 6.4.0): on review round 5+ a
          # blocker-free "changes" verdict auto-approves — findings stay
          # listed as advisory — so a fresh-findings-every-push review can
          # never block a PR forever. One blocker finding disables the cap.
          MAX_ROUNDS: '5'
          # The 8192 default truncated a chunk on this repo's first large PR
          # ("1/5 chunks truncated at the output-token limit"), which silently
          # drops findings after the cut. Rust diffs here are verbose.
          MAX_TOKENS: '16384'
          # Keep generated and fixture bytes out of the LLM diff. They are still
          # committed and still CI-checked; they just waste review budget and
          # produce noise findings.
          EXCLUDE_GLOBS: |
            crates/*/benches/fixtures/**
            crates/*/tests/fixtures/**
            docs/toolu/**
