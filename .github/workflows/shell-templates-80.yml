name: shell-templates-80

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# A newer push to a PR supersedes the older run, and nothing runs after a merge
# — the same rules as ci.yml. The checks `shell-templates` and `container` are
# required contexts on main like `ci` and `ci-macos`, so their names are pinned
# by scripts/test/shell_templates_workflow_test.sh. `shell-templates` aggregates
# the `host` matrix, because a job skipped by `if` runs no matrix and so could
# never report `host (ubuntu-24.04)` or `host (macos-15)`. The release PR runs
# nothing, for the reasons in ci.yml.
#
# The first steps of each job probe the OFFICIAL runner's shell semantics
# with no Rust at all; the last step of each job then compiles and runs the
# `execution` crate's integration tests against those probes (`cargo test -p
# execution --test integration -- shell_templates_test:: …` on the hosts,
# `shell_templates_container_test::` in the container job). That compile is
# why both jobs pin the toolchain and restore the dependency cache: without
# them every run built the crate's dependencies cold on a runner-image Rust.
concurrency:
  group: shell-templates-80-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host:
    if: ${{ github.head_ref != 'release-pr' || github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Official runner default shell preserves pipeline status
        run: false | true
      - name: Official runner explicit bash fails the pipeline
        id: pipefail
        continue-on-error: true
        shell: bash
        run: false | true
      - name: Verify explicit bash outcome
        shell: bash
        env:
          OUTCOME: ${{ steps.pipefail.outcome }}
        run: test "$OUTCOME" = failure
      - name: Official runner custom Perl template
        shell: perl {0} "quoted argument"
        run: |
          die "argument lost" unless $ARGV[0] eq "quoted argument";
          print "S80|perl|quoted argument\n";
      - name: Official runner Python extension
        shell: python
        run: |
          assert __file__.endswith('.py')
          print('S80|python|.py')
      - name: Official runner PowerShell native exit
        id: native
        continue-on-error: true
        shell: pwsh
        run: |
          if ([IO.Path]::GetExtension($PSCommandPath) -ne '.ps1') { throw 'extension' }
          Write-Output 'S80|pwsh|.ps1'
          /bin/sh -c 'exit 7'
      - name: Official runner PowerShell error
        id: pwsh_error
        continue-on-error: true
        shell: pwsh
        run: Write-Error 'expected shell80 probe failure'
      - name: Verify PowerShell outcomes
        shell: bash
        env:
          NATIVE: ${{ steps.native.outcome }}
          ERROR: ${{ steps.pwsh_error.outcome }}
        run: test "$NATIVE" = failure && test "$ERROR" = failure
      - name: Real toolu host and captured-message probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shell 80 scripts"
          TMPDIR="$RUNNER_TEMP/shell 80 scripts" cargo test -p execution --test integration -- shell_templates_test:: --include-ignored
          cargo test -p execution --test integration -- shell_templates_replay_test::

  # The required context over the `host` matrix, aggregated the way ci.yml does.
  shell-templates:
    needs: [host]
    if: ${{ always() && (github.head_ref != 'release-pr' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every host leg succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done

  container:
    if: ${{ github.head_ref != 'release-pr' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Real toolu job-container replay
        run: |
          mkdir -p "$RUNNER_TEMP/shell80"
          TOOLU_CONTAINER_TEST_ROOT="$RUNNER_TEMP/shell80" cargo test -p execution --test integration -- shell_templates_container_test:: --ignored --nocapture
