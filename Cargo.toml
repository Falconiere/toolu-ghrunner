# toolu-runner — unified Rust workspace
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Falconiere/toolu-ghrunner"

# ── Shared third-party pins ────────────────────────────────────────
# Crates used by more than one member live here so the pin has a single
# source of truth. `bollard` drives Docker from both `execution` (job-level
# service containers) and `daemon` (the per-job runner container).
[workspace.dependencies]
bollard = "0.20"

# ── Shared lint configuration ──────────────────────────────────────
# Strict by design — every error and warning is a code-quality signal we
# don't want to ship. CI runs `cargo clippy --workspace --all-targets -D
# warnings`, so every `warn` below is a hard failure there.
#
# Groups carry a negative `priority` so the individual lines beneath them
# win. The house kit (toolu-conventions, stacks/rust) sets `all` + `pedantic`
# with the two relaxations at the bottom; everything between them is this
# repo's own stricter set, kept because it exceeds the kit rather than
# deviating from it (unwrap/expect/panic are `deny` here, `warn` there).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
result_large_err = "deny"
map_err_ignore = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
single_match_else = "deny"
manual_let_else = "deny"
needless_pass_by_value = "deny"
disallowed_methods = "deny"
wildcard_enum_match_arm = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# The three cast lints above are the dangerous ones and stay denied.
# `cast_precision_loss` arrives with the kit's `pedantic` group and is
# deliberately NOT one of them: `PipelineContextData::n` is `Option<f64>`
# because GitHub's context numbers ARE IEEE-754 doubles (same as its JS
# runner), so the `i64`/`u64` → `f64` widening in
# `shared::job_message::context_data_de` is the wire contract, not a mistake.
# There is no lossless narrowing for an arbitrary 64-bit integer, and
# rejecting large values would fail a job over a big id. Re-denied would
# force a suppression at the one honest site — this keeps the rule truthful.
cast_precision_loss = "allow"
checked_conversions = "deny"
lossy_float_literal = "deny"
unnecessary_wraps = "deny"
trivially_copy_pass_by_ref = "deny"
cloned_instead_of_copied = "deny"
flat_map_option = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
large_types_passed_by_value = "deny"
implicit_clone = "deny"
str_to_string = "deny"
verbose_file_reads = "deny"
# The kit's two practical relaxations of the noisiest pedantic lints.
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "warn"
if_not_else = "warn"
match_same_arms = "warn"
redundant_else = "warn"
missing_docs_in_private_items = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
# CORE rule 8 / Rust STRUCTURE rule 2: a doc line on every public item and
# module — `///` on every pub fn, struct, enum, trait and field, `//!` at the
# top of each module. With -D warnings an undocumented public item is a CI
# failure.
missing_docs = "warn"
unused_imports = "deny"
deprecated = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

# ── Shared profile ─────────────────────────────────────────────────
# Dev profile: fast incremental compile, full debuginfo on our own crates
# (line tables only), zero debuginfo on deps.
[profile.dev]
opt-level = 0
incremental = true
split-debuginfo = "unpacked"
debug = 1
codegen-units = 256

[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package."*"]
debug = 0

[profile.test]
opt-level = 0
incremental = true
debug = 0
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
