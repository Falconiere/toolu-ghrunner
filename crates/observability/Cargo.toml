[package]
name = "observability"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Internal
shared = { path = "../shared" }

# Async runtime (journal writer/reader I/O)
tokio = { version = "1", features = ["rt", "sync", "fs", "io-util"] }

# Serialization (on-disk journal line contract)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# RFC3339 timestamps on journal lines
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Structured warnings (journal never fails the job; warn-once)
tracing = "0.1"

[lints]
workspace = true
