[package]
name = "toolu-runner"
version.workspace = true
edition.workspace = true
publish = false # never published to crates.io (mirrors release-plz.toml [workspace] publish = false)
license.workspace = true
repository.workspace = true
autotests = false # every tests/*.rs is a module of one of the two [[test]] targets below (#108)

[[bin]]
name = "toolu-runner"
path = "src/main.rs"

# One merged integration binary: tests/main.rs declares each tests/*.rs as a module.
[[test]]
name = "integration"
path = "tests/main.rs"

# Process-global state (env + tracing subscriber) must not share a process with
# the rest; see the header of tests/process_env.rs.
[[test]]
name = "process_env"
path = "tests/process_env.rs"

# Bin-only crate: main.rs + login_cmd.rs + status_cmd.rs. The engine lives in
# `execution`, the JIT lifecycle in `listener`; both reach the bin transitively
# through `listener`. `[dependencies]` lists only what the three bin files name
# directly — everything the integration tests need is in `[dev-dependencies]`.
[dependencies]
# Internal
shared = { path = "../shared" }
protocol = { path = "../protocol" }
network = { path = "../network" }
config = { path = "../config" }
wire = { path = "../wire" }
observability = { path = "../observability" }
listener = { path = "../listener" }

# Async runtime (bin: #[tokio::main] + SIGINT/SIGTERM signal bridge; `create-app`
# reads its wait-time line commands from stdin, #202)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "io-std", "io-util"] }
tokio-util = "0.7"

# Web / HTTP (register `generate-jitconfig` + device-flow login clients).
# `rustls-tls-webpki-roots` is already unified on at runtime by `opendal`'s
# default `rustls-tls` (normal-dep chain listener → execution → cache →
# opendal; `cargo tree -p toolu-runner -e normal -i opendal`). Naming it here
# keeps the trust `check` reports (platform/SSL_CERT_* roots PLUS the
# compiled-in Mozilla set) true even if that chain changes.
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

# Observability (no OTel in v1)
tracing = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TLS trust report for `check` (the same loader reqwest's native-roots feature calls)
rustls-native-certs = "0.8"

# Utilities
url = ">=2, <2.5.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hostname = "0.4"
# `setup` prompts: raw terminal mode on /dev/tty (safe API only; the
# prompt logic and key parsing are ours in setup/prompts.rs).
crossterm = "0.29"
# Free-space probe for `doctor` (`fs2::available_space`; also the lock crate).
fs2 = "0.4"
# `doctor` reads the release document's `tag_name` and the `/user` login.
serde_json = "1"
# Decorrelated-jitter backoff for the always-online run loop (run_cmd).
fastrand = "2"
# `create-app` copies the install link to the clipboard over OSC 52 (#202).
base64 = "0.22"

[dev-dependencies]
# Internal — the test target integration-tests the full engine graph, so it
# names `execution` / `expressions` / `cache` directly (the bin only reaches
# them transitively through `listener`).
execution = { path = "../execution" }
expressions = { path = "../expressions" }
cache = { path = "../cache" }

# HTTP mocking + filesystem / test fixtures
wiremock = "0.6"
tempfile = "3"
# #94 proxy / custom-CA tests: real rcgen PKI, rustls servers and a recording
# CONNECT proxy (`network/tests/helpers/{tls,proxy}_fixtures.rs`).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# Safe, scoped process-env mutation for the resolve_bearer env test.
# The crate keeps all `unsafe env::set_var` internal, so our tests stay
# `unsafe`-free (workspace `unsafe_code = "deny"`).
temp-env = "0.3"
filetime = "0.2"
# Captures `network_setup`'s INFO line to pin its once-per-change memo (#94).
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Async / futures test helpers
futures-util = "0.3"

toml = "0.8"

# Crypto fixtures for the auth / jit-config tests
# Verifies the App JWTs the runner sends to the loopback GitHub peer (#201).
jsonwebtoken = "9"
rsa = "0.9"
pkcs1 = "0.7"
aes = "0.8"
cbc = "0.1"
sha1 = "0.10"
blake3 = "1"
# CSPRNG for the crypto-fixture tests
rand = { version = "0.8", features = ["std_rng"] }

# Local HTTP service tests
axum = "0.8"

# Archive fixtures
tar = "0.4"
flate2 = "1"

# Id fixtures (fs2 for lock fixtures is a normal dependency)
uuid = { version = "1", features = ["v4", "serde"] }

[features]
e2e = []
e2e-live = ["e2e"]
e2e-live-ghes = ["e2e"]
# `live` gates the integration tests in `tests/live/`. They hit the real
# GitHub API (POST registration-token, dispatch workflows, etc.) and are
# only meaningful when run against a real test repo + PAT. Default builds
# (no feature flag) skip them entirely so `cargo test --workspace` is
# hermetic. Use `cargo test -p toolu-runner --features live` to enable
# the harness and `cargo test -p toolu-runner --features live -- --ignored`
# to actually execute the live tests.
live = []
live-ghes = ["live"]
# Forwards `listener/capture` (acquired-body capture for the #103 evidence
# lane). Off by default and never part of a release build.
capture = ["listener/capture"]

[lints]
workspace = true
