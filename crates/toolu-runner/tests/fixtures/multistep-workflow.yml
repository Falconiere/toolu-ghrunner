# Pushed by live_e2e.rs::multi_step_job: checkout, setup-node and a real
# `docker://` container action. The container writes a marker and a step output
# that only exist inside Alpine (/etc/alpine-release), and the last step asserts
# both, so echoing a docker:// string can never pass (#103 S2).
name: multistep
on:
  workflow_dispatch:
jobs:
  hello:
    runs-on: [self-hosted, toolu-runner-v1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: write container probe
        run: |
          cat > docker-probe.sh <<'PROBE'
          set -eu
          release=$(cat /etc/alpine-release)
          printf '%s\n' "$release" > docker-live.txt
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
          PROBE
      - name: alpine via docker
        id: container
        uses: docker://alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        with:
          entrypoint: /bin/sh
          args: docker-probe.sh
      - name: verify container effects
        run: |
          test '${{ steps.container.outputs.release }}' = 3.20.10
          test "$(cat docker-live.txt)" = 3.20.10
          node --version | grep -q '^v'
