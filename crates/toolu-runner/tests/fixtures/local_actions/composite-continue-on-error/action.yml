name: 'composite-continue-on-error'
description: 'First inner step fails but continue-on-error lets the second inner step run.'
runs:
  using: 'composite'
  steps:
    - name: failing step
      shell: bash
      continue-on-error: true
      run: exit 1
    - name: second step
      shell: bash
      run: echo "second-ran" >> "$MARKER_FILE"
