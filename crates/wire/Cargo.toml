[package]
name = "wire"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Internal
shared = { path = "../shared" }
protocol = { path = "../protocol" }
network = { path = "../network" }

# Async runtime
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"

# HTTP transport
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-native-roots"] }

# WebSocket for the live-log streamer
# Framing only: the handshake runs over a `reqwest` upgrade (#94), so TLS and
# proxying come from the shared `network` client, not tungstenite.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# Upload metadata timestamps; same 0.4 constraint/features as shared.
# Direct use requires a direct dependency; shared does not re-export chrono.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"

# URL parsing (device-flow host validation)
url = ">=2, <2.5.8"

# Observability (no OTel in v1)
tracing = "0.1"

[dev-dependencies]
# #94 proxy / custom-CA tests: real rcgen PKI, rustls servers and a recording
# CONNECT proxy (`network/tests/helpers/network_fixtures.rs`).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
