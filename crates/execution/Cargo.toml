[package]
name = "execution"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
autotests = false # every tests/*.rs is a module of one of the two [[test]] targets below (#109)

# One merged integration binary: tests/main.rs declares each tests/*.rs as a module.
[[test]]
name = "integration"
path = "tests/main.rs"

# `network_step_env_test` sets proxy env vars process-wide around whole job
# runs; see the header of tests/process_env.rs.
[[test]]
name = "process_env"
path = "tests/process_env.rs"

[dependencies]
# Internal
shared = { path = "../shared" }
network = { path = "../network" }
expressions = { path = "../expressions" }
cache = { path = "../cache" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io-util"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"

# Web / HTTP
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-native-roots", "stream"] }

# Local HTTP services (artifact / cache / OIDC micro-services)
axum = "0.8"

# OIDC JWT minting
jsonwebtoken = "9"

# Shadow-mode fingerprints (records only)
blake3 = "1"

# Observability (no OTel in v1)
tracing = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
hostname = "0.4"
tempfile = "3"
tar = "0.4"
flate2 = "1"
shlex = "1"
# Process enumeration + environ reads for job-end orphan cleanup (issue #89);
# the same version `config` pins (Linux `/proc`, macOS `KERN_PROCARGS2`).
sysinfo = "0.37"
# Workspace leases (issue #90); the same version `config` pins for its lockfile.
fs2 = "0.4"

# Docker
bollard = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
# Integration tests build a real HeaderMap / assert StatusCode against the
# service-auth + OIDC url helpers (a normal dep isn't visible to tests/).
axum = "0.8"
criterion = "0.5"
# Safe, scoped DOCKER_HOST mutation for the endpoint-resolution wiring test.
# The crate keeps all `unsafe env::set_var` internal, so our tests stay
# `unsafe`-free (workspace `unsafe_code = "forbid"`).
temp-env = { version = "0.3", features = ["async_closure"] }
# #94 proxy / custom-CA tests: real rcgen PKI, rustls servers and a recording
# CONNECT proxy (`network/tests/helpers/{tls,proxy}_fixtures.rs`).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

[[bench]]
name = "interpolate"
harness = false
test = false
