[package]
name = "listener"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
# Internal
execution = { path = "../execution" }
wire = { path = "../wire" }
observability = { path = "../observability" }
shared = { path = "../shared" }
protocol = { path = "../protocol" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

# Web / HTTP
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls-native-roots"] }

# Serialization
serde_json = "1"

# Observability (no OTel in v1)
tracing = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1"

# Jitter for poll backoff (never for secrets)
fastrand = "2"

[dev-dependencies]
# `net` + `io-util` for the `cleanup_session` test's real local TcpListener
# (AsyncWriteExt to write a raw 404 response). The crate's normal `tokio`
# features (rt-multi-thread, macros, sync, time) have neither.
tokio = { version = "1", features = ["net", "io-util"] }
# HTTP mocking + filesystem fixtures for the in-crate watchdog/retry tests
# (private-seam ACs unreachable from crates/listener/tests/).
wiremock = "0.6"
tempfile = "3"
# `support.rs`'s recording HTTP server (real axum/hyper, not wiremock — it
# needs per-request arrival `Instant`s and test-controlled held responses,
# which wiremock cannot do) for the startup/completion overlap ACs.
axum = "0.8"
# `support.rs`'s accept-side WebSocket server standing in for GitHub's
# live-log `FeedStreamUrl` feed. The crate's normal `wire` dependency only
# exposes the CLIENT-side `LiveLogStreamer::connect` (via `tokio-tungstenite`
# internally); the server (accept) side needs the crate directly.
tokio-tungstenite = "0.26"
# `StreamExt` to drain frames off the accepted WebSocket in `support.rs`.
futures-util = "0.3"

[lints]
workspace = true
