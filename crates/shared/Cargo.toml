[package]
name = "shared"
version.workspace = true
edition.workspace = true
publish = false # never published to crates.io (mirrors release-plz.toml [workspace] publish = false)
license.workspace = true
repository.workspace = true
autotests = false # every tests/*.rs is a module of the [[test]] target below (#109)

# One merged integration binary: tests/main.rs declares each tests/*.rs as a module.
[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
aho-corasick = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "secret_masker"
harness = false
test = false

[lints]
workspace = true
