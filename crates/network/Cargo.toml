[package]
name = "network"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false # every tests/*.rs is a module of the [[test]] target below (#109)

# One merged integration binary: tests/main.rs declares each tests/*.rs as a module.
[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
# Internal
shared = { path = "../shared" }

# HTTP clients: the ONLY production `reqwest::Client` construction (#94).
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
# PEM parsing + trust-anchor validation of `[network] ca_bundle` (no crypto
# provider needed; the same rustls reqwest already links).
rustls = { version = "0.23", default-features = false, features = ["std"] }
# `Proxy-Authorization` credential registered with the secret masker.
base64 = "0.22"
# Percent-decoding of proxy URL userinfo.
percent-encoding = "2"
# Proxy URL parsing for env mode, redaction and masking (the same pin as the
# bin: `url` 2.5.8 needs a newer MSRV).
url = ">=2, <2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tempfile = "3"
temp-env = "0.3"
# Test-time PKI + TLS servers for real handshakes (no committed keys).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
