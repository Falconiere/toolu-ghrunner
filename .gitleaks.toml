# Gitleaks config: keep the default ruleset, allowlist the committed
# synthetic test fixtures (ghs_EXAMPLE… tokens used to verify secret
# masking — flagged as github-app-token otherwise).
#
# NOTE: this file governs LOCAL `gitleaks detect` runs only (auto-detected at
# the repo root). The CI review action pins its own config via
# `--config $GITHUB_ACTION_PATH/gitleaks.toml`, so nothing here reaches it.
# The list that silences BOTH is .gitleaksignore: gitleaks reads it from the
# scan root regardless of `--config`, one `path:rule:line` fingerprint per
# synthetic fixture, each annotated with why the value authenticates nothing
# and pinned by scripts/test/gitleaks_ignore_test.sh. Keep this allowlist
# for the broad local path exemptions; add a NEW fixture to .gitleaksignore.
[extend]
useDefault = true

# `paths` entries are RE2 regexes (triple-quoted per the gitleaks docs).
[[allowlists]]
description = "Synthetic secret-masking test fixtures — not real credentials"
paths = [
  '''toolu-runner/tests/fixtures/job_message\.json''',
  '''toolu-runner/tests/fixtures/generate_jitconfig_response\.json''',
  '''toolu-runner/tests/gh_compat_context\.rs''',
]
